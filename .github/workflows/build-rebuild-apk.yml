name: Build Qabilat Al Tanja Rebuild APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'rebuild/**'
      - '.github/workflows/build-rebuild-apk.yml'

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - name: Install Godot 4.3 and export templates
        run: |
          mkdir -p "$HOME/godot"
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d "$HOME/godot"
          sudo install "$HOME/godot/Godot_v4.3-stable_linux.x86_64" /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
      - name: Configure Android build
        run: |
          mkdir -p "$HOME/.config/godot"
          keytool -genkeypair -v -keystore "$HOME/.config/godot/android_debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$HOME/.config/godot/android_debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_password = "android"
          EOF
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.config/godot/android_debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
      - name: Import clean project
        run: |
          cd rebuild
          timeout 8m godot --headless --editor --path . --import --quit --verbose
      - name: Validate project and export APK
        run: |
          mkdir -p rebuild/build
          godot --headless --editor --path rebuild --quit --verbose
          timeout 12m godot --headless --path rebuild --verbose --export-debug "Android" rebuild/build/Qabilat-Al-Tanja-Rebuild.apk 2>&1 | tee /tmp/godot-export.log
          test -s rebuild/build/Qabilat-Al-Tanja-Rebuild.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Qabilat-Al-Tanja-Rebuild-APK
          path: rebuild/build/Qabilat-Al-Tanja-Rebuild.apk
          if-no-files-found: error
