name: Build Qabilat Al Tanja 3D APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'godot/**'
      - '.github/workflows/build-godot-apk.yml'

jobs:
  android:
    runs-on: ubuntu-latest
        steps:
      - uses: actions/checkout@v4
      - name: Prepare Godot and Android export tools
        uses: firebelley/godot-export@v6.0.0
        with:
          godot_version: 4.3.0
          export_type: release
          preset: Android
          project_path: godot
          archive_output: false
          android_export: true
      - name: Export Android APK
        run: |
          mkdir -p build
          cd godot
          godot --headless --verbose --editor --quit
          godot --headless --path . --export-debug "Android" ../build/Qabilat-Al-Tanja-3D.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Qabilat-Al-Tanja-3D-APK
          path: build/Qabilat-Al-Tanja-3D.apk
          if-no-files-found: error
