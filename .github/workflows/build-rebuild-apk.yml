name: Build Qabilat Al Tanja Rebuild APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'rebuild/**'
      - '.github/workflows/build-rebuild-apk.yml'

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"
      - name: Install Godot 4.3 and export templates
        run: |
          mkdir -p "$HOME/godot"
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d "$HOME/godot"
          sudo install "$HOME/godot/Godot_v4.3-stable_linux.x86_64" /usr/local/bin/godot
          wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz -O /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.3.stable/"
      - name: Configure Android build
        run: |
          mkdir -p "$HOME/.config/godot"
          keytool -genkeypair -v -keystore "$HOME/.config/godot/android_debug.keystore" -storepass "$KEYSTORE_PASSWORD" -alias androiddebugkey -keypass "$KEYSTORE_PASSWORD" -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "DEBUG_KEYSTORE=$HOME/.config/godot/android_debug.keystore" >> "$GITHUB_ENV"
          cat > "$HOME/.config/godot/editor_settings-4.3.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
      - name: Import clean project
        run: |
          cd rebuild
          timeout 8m godot --headless --editor --path . --import --quit --verbose
      - name: Export, align and sign APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/rebuild/build"
          godot --headless --editor --path "$GITHUB_WORKSPACE/rebuild" --quit --verbose
          timeout 12m godot --headless --path "$GITHUB_WORKSPACE/rebuild" --verbose --export-debug "Android" "$GITHUB_WORKSPACE/rebuild/build/unsigned.apk" 2>&1 | tee /tmp/godot-export.log
          test -s "$GITHUB_WORKSPACE/rebuild/build/unsigned.apk"
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -f -v 4 "$GITHUB_WORKSPACE/rebuild/build/unsigned.apk" "$GITHUB_WORKSPACE/rebuild/build/aligned.apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign --ks "$DEBUG_KEYSTORE" --ks-key-alias androiddebugkey --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD --out "$GITHUB_WORKSPACE/rebuild/build/Qabilat-Al-Tanja-Rebuild.apk" "$GITHUB_WORKSPACE/rebuild/build/aligned.apk"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$GITHUB_WORKSPACE/rebuild/build/Qabilat-Al-Tanja-Rebuild.apk"
          test -s "$GITHUB_WORKSPACE/rebuild/build/Qabilat-Al-Tanja-Rebuild.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Qabilat-Al-Tanja-Rebuild-APK
          path: rebuild/build/Qabilat-Al-Tanja-Rebuild.apk
          if-no-files-found: error
